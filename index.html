<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#534AB7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>十篇攻克法 | 英语能力训练</title>
<style>
  :root {
    --primary: #534AB7;
    --primary-light: #7B74D4;
    --primary-dark: #3D3589;
    --bg: #0F0F1A;
    --surface: #1A1A2E;
    --surface2: #22223B;
    --text: #F0EFFF;
    --text-muted: #9997BB;
    --accent: #FF6B9D;
    --success: #4CAF50;
    --gold: #FFD700;
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'PingFang SC','Microsoft YaHei',sans-serif; overflow-x:hidden; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
    padding: 50px 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content:'';
    position:absolute; top:-60px; right:-40px;
    width:220px; height:220px;
    background: radial-gradient(circle, rgba(83,74,183,0.4) 0%, transparent 70%);
    pointer-events:none;
  }
  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .app-brand { display:flex; align-items:center; gap:10px; }
  .app-icon { width:40px; height:40px; background:linear-gradient(135deg,#534AB7,#9C27B0); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .app-name { font-size:18px; font-weight:700; letter-spacing:0.5px; }
  .app-sub { font-size:11px; color:var(--text-muted); }
  .streak-badge { background:rgba(255,215,0,0.15); border:1px solid rgba(255,215,0,0.4); border-radius:20px; padding:6px 14px; font-size:13px; color:var(--gold); display:flex; align-items:center; gap:6px; }

  /* ── Overall Stats ── */
  .overall-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
  .stat-card { background:rgba(255,255,255,0.06); border-radius:12px; padding:12px; text-align:center; }
  .stat-num { font-size:24px; font-weight:800; color:var(--primary-light); }
  .stat-label { font-size:11px; color:var(--text-muted); margin-top:2px; }

  /* ── Progress Arc ── */
  .progress-arc-wrap { display:flex; align-items:center; gap:16px; margin-bottom:4px; }
  .arc-svg { flex-shrink:0; }
  .progress-desc h2 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .progress-desc p { font-size:12px; color:var(--text-muted); line-height:1.5; }
  .milestone-row { display:flex; gap:8px; flex-wrap:wrap; }
  .milestone-pip { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .pip { width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text-muted); transition:all .3s; }
  .pip.done { background:var(--primary); border-color:var(--primary); color:#fff; }
  .pip.current { border-color:var(--gold); color:var(--gold); animation:pulse 1.5s infinite; }
  .pip-label { font-size:9px; color:var(--text-muted); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4)} 50%{box-shadow:0 0 0 6px rgba(255,215,0,0)} }

  /* ── Section ── */
  .section { padding: 0 16px 16px; }
  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .section-title { font-size:14px; font-weight:700; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }
  .section-hint { font-size:12px; color:var(--text-muted); }

  /* ── Material Cards ── */
  .materials-grid { display:flex; flex-direction:column; gap:10px; }
  .mat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
    border: 1.5px solid transparent;
    transition: all .2s;
    position:relative; overflow:hidden;
  }
  .mat-card::before {
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:4px;
    background: var(--level-color, var(--primary));
    border-radius: 4px 0 0 4px;
  }
  .mat-card:active { transform:scale(0.98); }
  .mat-card.locked { opacity:0.5; cursor:not-allowed; }
  .mat-card.active { border-color: rgba(83,74,183,0.5); background:var(--surface2); }
  .mat-card.completed { border-color: rgba(76,175,80,0.4); }

  .mat-num { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; background:rgba(255,255,255,0.08); color:var(--text-muted); flex-shrink:0; }
  .mat-num.done { background:var(--success); color:#fff; font-size:16px; }
  .mat-num.current { background:var(--primary); color:#fff; }

  .mat-info { flex:1; min-width:0; }
  .mat-title-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .mat-title { font-size:15px; font-weight:700; }
  .level-badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; background:rgba(255,255,255,0.1); color:var(--text-muted); white-space:nowrap; }
  .mat-topic { font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .mat-progress-bar { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
  .mat-progress-fill { height:100%; border-radius:2px; background:var(--level-color, var(--primary)); transition:width .5s; }
  .mat-scores { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .score-chip { font-size:10px; padding:2px 7px; border-radius:10px; background:rgba(255,255,255,0.06); color:var(--text-muted); }
  .score-chip.done { color:#4CAF50; background:rgba(76,175,80,0.15); }
  .score-chip.active { color:#FFD700; background:rgba(255,215,0,0.1); }

  .mat-action { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
  .mat-status { font-size:22px; }
  .mat-status-text { font-size:10px; color:var(--text-muted); }

  /* ── Bottom Nav ── */
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display:flex;
    padding-bottom: env(safe-area-inset-bottom, 8px);
    z-index:100;
  }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0 4px; gap:3px; cursor:pointer; transition:opacity .2s; text-decoration:none; }
  .nav-item:active { opacity:.7; }
  .nav-icon { font-size:22px; line-height:1; }
  .nav-label { font-size:10px; color:var(--text-muted); }
  .nav-item.active .nav-label { color:var(--primary-light); }
  .nav-item.active .nav-icon { filter: drop-shadow(0 0 6px var(--primary-light)); }

  .page-bottom-pad { height:80px; }

  /* ── Intro Banner ── */
  .intro-banner {
    margin: 0 16px 16px;
    background: linear-gradient(135deg, rgba(83,74,183,0.2), rgba(156,39,176,0.15));
    border: 1px solid rgba(83,74,183,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    display:flex; gap:12px; align-items:flex-start;
  }
  .intro-icon { font-size:28px; flex-shrink:0; }
  .intro-text h3 { font-size:13px; font-weight:700; margin-bottom:4px; color:var(--primary-light); }
  .intro-text p { font-size:12px; color:var(--text-muted); line-height:1.6; }

  /* ── Modal ── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:flex-end; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--surface); border-radius:24px 24px 0 0; padding:20px; width:100%; max-height:60vh; overflow-y:auto; animation:slideUp .3s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal h3 { font-size:16px; font-weight:700; margin-bottom:12px; }
  .modal-tip { background:rgba(83,74,183,0.15); border-radius:12px; padding:12px; font-size:12px; color:var(--text-muted); line-height:1.7; margin-bottom:16px; }
  .modal-btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .modal-close-btn { width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:var(--text-muted); font-size:14px; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-brand">
      <div class="app-icon">📖</div>
      <div>
        <div class="app-name">十篇攻克法</div>
        <div class="app-sub">AI英语能力训练系统</div>
      </div>
    </div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakNum">0</span> 天连续</div>
  </div>

  <div class="overall-stats">
    <div class="stat-card">
      <div class="stat-num" id="statCompleted">0</div>
      <div class="stat-label">已完成篇</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAvgScore">—</div>
      <div class="stat-label">综合均分</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statDays">0</div>
      <div class="stat-label">学习天数</div>
    </div>
  </div>

  <div class="progress-arc-wrap">
    <svg class="arc-svg" width="80" height="80" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
      <circle id="arcFill" cx="40" cy="40" r="32" fill="none" stroke="#534AB7" stroke-width="8"
        stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round"
        transform="rotate(-90 40 40)" style="transition:stroke-dashoffset 1s ease"/>
      <text x="40" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#F0EFFF" id="arcPct">0%</text>
      <text x="40" y="50" text-anchor="middle" font-size="8" fill="#9997BB">完成度</text>
    </svg>
    <div class="progress-desc">
      <h2 id="progressTitle">开始你的英语之旅</h2>
      <p id="progressHint">从第1篇开始，逐篇深度攻克，<br>培养真正的英语语感</p>
      <div class="milestone-row" id="milestoneRow"></div>
    </div>
  </div>
</div>

<div class="intro-banner">
  <div class="intro-icon">⚡</div>
  <div class="intro-text">
    <h3>核心法则：只求透，不求多</h3>
    <p>每篇材料严格按照「盲听→词汇→背诵→输出」四步训练，任何环节未过，禁止进入下一环节。</p>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span class="section-title">10篇训练材料</span>
    <span class="section-hint">A1 → C1 逐级突破</span>
  </div>
  <div class="materials-grid" id="materialsGrid"></div>
</div>

<div class="page-bottom-pad"></div>

<nav class="bottom-nav">
  <a class="nav-item active" href="index.html">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">主页</span>
  </a>
  <a class="nav-item" href="train.html">
    <span class="nav-icon">🎯</span>
    <span class="nav-label">训练</span>
  </a>
  <a class="nav-item" href="progress.html">
    <span class="nav-icon">📊</span>
    <span class="nav-label">进度</span>
  </a>
  <a class="nav-item" href="tips.html">
    <span class="nav-icon">💡</span>
    <span class="nav-label">技巧</span>
  </a>
</nav>

<!-- Locked Modal -->
<div class="modal-overlay" id="lockedModal">
  <div class="modal">
    <h3>🔒 尚未解锁</h3>
    <div class="modal-tip" id="lockedModalMsg">请先完成上一篇材料的全部训练环节，才能解锁本篇。</div>
    <button class="modal-btn" onclick="document.getElementById('lockedModal').classList.remove('show')">知道了</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const STAGE_KEYS = ['listening','vocab','recite','output'];
const STAGE_LABELS = {listening:'🎧听力', vocab:'📖词汇', recite:'🗣️背诵', output:'✍️输出'};

function init() {
  const data = App.getData();
  const mats = data.materials || [];

  // Merge preset data with saved progress
  const merged = MATERIALS_DB.map((preset, i) => {
    const saved = mats.find(m => m.id === preset.id) || {};
    return Object.assign({}, preset, { stages: saved.stages || {}, startedAt: saved.startedAt || null });
  });

  // Update stats
  const completedArr = merged.filter(m => STAGE_KEYS.every(s => (m.stages[s]||0) >= 60));
  const completedCount = completedArr.length;
  document.getElementById('statCompleted').textContent = completedCount;

  let totalScore = 0, scoreCount = 0;
  merged.forEach(m => STAGE_KEYS.forEach(s => { if (m.stages[s]) { totalScore += m.stages[s]; scoreCount++; } }));
  document.getElementById('statAvgScore').textContent = scoreCount > 0 ? Math.round(totalScore/scoreCount) : '—';

  const days = data.studyDays || 0;
  document.getElementById('statDays').textContent = days;
  document.getElementById('streakNum').textContent = data.streak || 0;

  // Arc
  const pct = completedCount / 10;
  const circumference = 201;
  document.getElementById('arcFill').setAttribute('stroke-dashoffset', circumference * (1 - pct));
  document.getElementById('arcPct').textContent = Math.round(pct * 100) + '%';

  if (completedCount === 0) {
    document.getElementById('progressTitle').textContent = '开始你的英语之旅';
    document.getElementById('progressHint').textContent = '从第1篇开始，逐篇深度攻克，培养真正的英语语感';
  } else if (completedCount < 10) {
    document.getElementById('progressTitle').textContent = `已完成 ${completedCount}/10 篇`;
    document.getElementById('progressHint').textContent = `继续加油！${10-completedCount} 篇后将完成能力跃迁`;
  } else {
    document.getElementById('progressTitle').textContent = '🎉 恭喜完成全部10篇！';
    document.getElementById('progressHint').textContent = '你已完成英语能力跃迁训练，现在开始第二轮复习吧';
  }

  // Milestones
  const milestones = [1,3,5,10];
  const mRow = document.getElementById('milestoneRow');
  mRow.innerHTML = milestones.map(n => {
    const done = completedCount >= n;
    const current = !done && (n === milestones.find(x => completedCount < x));
    return `<div class="milestone-pip">
      <div class="pip ${done?'done':''} ${current?'current':''}">${done?'✓':n}</div>
      <div class="pip-label">第${n}篇</div>
    </div>`;
  }).join('');

  // Cards
  const grid = document.getElementById('materialsGrid');
  grid.innerHTML = merged.map((m, i) => {
    const stageCount = STAGE_KEYS.filter(s => (m.stages[s]||0) >= 60).length;
    const isCompleted = stageCount === 4;
    const isLocked = i > 0 && !STAGE_KEYS.every(s => (merged[i-1].stages[s]||0) >= 60);
    const isCurrent = !isLocked && !isCompleted;
    const progress = stageCount / 4 * 100;

    return `<div class="mat-card ${isCompleted?'completed':''} ${isCurrent&&stageCount>0?'active':''} ${isLocked?'locked':''}"
      style="--level-color:${m.levelColor}"
      onclick="onCardClick(${m.id}, ${isLocked})">
      <div class="mat-num ${isCompleted?'done':''} ${isCurrent&&stageCount>0?'current':''}">${isCompleted?'✓':m.id}</div>
      <div class="mat-info">
        <div class="mat-title-row">
          <span class="mat-title">${m.title}</span>
          <span class="level-badge" style="color:${m.levelColor};background:${m.levelColor}22">${m.level}</span>
        </div>
        <div class="mat-topic">${m.topic} · ${m.tags.slice(0,2).join(' / ')}</div>
        <div class="mat-progress-bar"><div class="mat-progress-fill" style="width:${progress}%"></div></div>
        <div class="mat-scores">
          ${STAGE_KEYS.map(s => {
            const score = m.stages[s]||0;
            const cls = score>=60?'done':(isCurrent&&!isLocked&&STAGE_KEYS.indexOf(s)===stageCount?'active':'');
            return `<span class="score-chip ${cls}">${STAGE_LABELS[s]}${score>0?' '+score:''}`;
          }).join('')}
        </div>
      </div>
      <div class="mat-action">
        <div class="mat-status">${isLocked?'🔒':isCompleted?'🏆':isCurrent&&stageCount>0?'⚡':'▶️'}</div>
        <div class="mat-status-text">${isLocked?'未解锁':isCompleted?'完成':isCurrent&&stageCount>0?'进行中':'开始'}</div>
      </div>
    </div>`;
  }).join('');
}

function onCardClick(id, isLocked) {
  if (isLocked) {
    document.getElementById('lockedModal').classList.add('show');
    return;
  }
  window.location.href = 'train.html?id=' + id;
}

// Close modal on overlay click
document.getElementById('lockedModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(r => console.log('SW registered'))
    .catch(e => console.log('SW error', e));
}
</script>
</body>
